<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ghost Home — Demo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f0f1a;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #game-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      #resizer {
        width: 6px;
        cursor: col-resize;
        background: #333;
        z-index: 10;
        flex-shrink: 0;
      }
      #editor-wrap {
        width: 380px;
        min-width: 200px;
        max-width: 600px;
        background: #0f0f1a;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-wrap"></div>
      <div id="resizer"></div>
      <div id="editor-wrap"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
