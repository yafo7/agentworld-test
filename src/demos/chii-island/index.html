<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chii Island — 奇异岛</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      #app { display: flex; width: 100%; height: 100%; }
      #game-wrap { flex: 1; position: relative; overflow: hidden; }
      #resizer { width: 6px; cursor: col-resize; background: #333; z-index: 10; flex-shrink: 0; }
      #editor-wrap { width: 380px; min-width: 200px; max-width: 600px; background: #0f0f1a; display: flex; flex-direction: column; flex-shrink: 0; }

      /* ESC management panel */
      #mgmt-panel {
        position: fixed; inset: 0; z-index: 100;
        background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center;
      }
      #mgmt-panel.visible { display: flex; }
      .mgmt-card {
        background: #1a1a2e; border: 1px solid #333; border-radius: 12px;
        padding: 24px 32px; min-width: 280px; color: #ccc;
        box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      }
      .mgmt-card h2 { margin: 0 0 16px; font-size: 18px; color: #fff; }
      .mgmt-card label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; padding: 4px 0; }
      .mgmt-card input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
      .mgmt-hint { margin-top: 12px; font-size: 11px; color: #666; }

      /* E-key interaction prompt */
      #interact-prompt {
        position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
        padding: 8px 14px; border-radius: 8px;
        background: rgba(0,0,0,0.65); color: #f5ead0;
        font-family: "Microsoft YaHei","PingFang SC",sans-serif;
        font-size: 14px; display: flex; align-items: center; gap: 8px;
        pointer-events: none; opacity: 0;
        transition: opacity 0.15s ease; z-index: 150;
        backdrop-filter: blur(4px);
      }
      #interact-prompt.visible { opacity: 1; }
      .keycap {
        display: inline-flex; align-items: center; justify-content: center;
        width: 22px; height: 22px; border-radius: 4px;
        background: #f5ead0; color: #2a2330;
        font-weight: bold; font-size: 12px;
        box-shadow: 0 2px 0 #2a2330; flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-wrap"></div>
      <div id="resizer"></div>
      <div id="editor-wrap"></div>
    </div>

    <!-- ESC management panel -->
    <div id="mgmt-panel">
      <div class="mgmt-card">
        <h2>管理面板</h2>
        <label><input type="checkbox" id="chk-collision" /> 显示碰撞体积</label>
        <div class="mgmt-hint">按 ESC 关闭面板 · 点击面板外关闭</div>
      </div>
    </div>

    <!-- E-key interaction prompt -->
    <div id="interact-prompt">
      <span class="keycap">E</span>
      <span id="interact-prompt-text"></span>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
